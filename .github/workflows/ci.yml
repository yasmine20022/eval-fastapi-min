name: CI/CD to Minikube
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t eval-fastapi-min:latest .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
      - name: Build image inside Minikube
        run: |
          eval $(minikube docker-env)
          docker build -t eval-fastapi-min:latest .
      - name: Create Kubernetes manifest
        run: |
          mkdir -p /tmp/devops-autopilot-k8s
          cat > /tmp/devops-autopilot-k8s/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: eval-fastapi-min
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: eval-fastapi-min
            template:
              metadata:
                labels:
                  app: eval-fastapi-min
              spec:
                containers:
                  - name: eval-fastapi-min
                    image: eval-fastapi-min:latest
                    imagePullPolicy: Never
                    ports:
                      - containerPort: 8000
                    readinessProbe:
                      tcpSocket:
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 5
                    livenessProbe:
                      tcpSocket:
                        port: 8000
                      initialDelaySeconds: 15
                      periodSeconds: 10
          EOF
      - name: Deploy to Minikube
        run: |
          if [ -d k8s ]; then
            kubectl apply -f k8s/
          else
            kubectl apply -f /tmp/devops-autopilot-k8s/deployment.yaml
          fi
      - name: Expose app inside cluster
        run: |
          kubectl expose deployment eval-fastapi-min \
            --name=eval-fastapi-min \
            --type=ClusterIP \
            --port=80 \
            --target-port=8000 \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Wait for rollout
        run: kubectl rollout status deployment/eval-fastapi-min --timeout=120s
      - name: Smoke test deployed app
        run: |
          kubectl port-forward service/eval-fastapi-min 18080:80 > /tmp/eval-fastapi-min-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          for path in /health /health/ /; do
            for attempt in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:18080$path" >/tmp/eval-fastapi-min-response.txt; then
                echo "Smoke test passed on $path"
                exit 0
              fi
              sleep 2
            done
          done

          echo "Smoke test failed: app did not return a successful HTTP response."
          cat /tmp/eval-fastapi-min-port-forward.log || true
          kubectl get pods -o wide
          kubectl describe deployment eval-fastapi-min
          kubectl logs deployment/eval-fastapi-min --tail=100 || true
          exit 1
