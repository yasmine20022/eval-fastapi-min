apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: deploy-proj-95da51ae662c
  labels:
    app: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-deploy-proj-95da51ae662c
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor", "/metrics/resource"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-deploy-proj-95da51ae662c
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-deploy-proj-95da51ae662c
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: deploy-proj-95da51ae662c
