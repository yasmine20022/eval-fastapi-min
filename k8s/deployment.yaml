apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-fastapi-min
  labels:
    app: eval-fastapi-min
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-fastapi-min
  template:
    metadata:
      labels:
        app: eval-fastapi-min
    spec:
      containers:
      - name: eval-fastapi-min
        image: eval-fastapi-min:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 512Mi
            cpu: 500m
